name: Analyze Stock (Short-term, <12mo)

on:
  workflow_dispatch:
    inputs:
      stock:
        description: "Ticker or company name to analyze (e.g. RELIANCE.NS, or a US ticker)"
        required: true
        type: string
      target_return_pct:
        description: "Target return % within the hold window"
        required: false
        default: "25"
        type: string
      max_hold_months:
        description: "Maximum months for this horizon"
        required: false
        default: "12"
        type: string
      investment_amount:
        description: "Example position size for the report's illustration (any currency amount)"
        required: false
        default: "5000"
        type: string
      risk_pct_per_trade:
        description: "% of the investment amount to risk on this trade, for risk-adjusted position sizing"
        required: false
        default: "1.5"
        type: string
      force_rerun:
        description: "Re-run even if a report for this ticker already exists from today"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run analysis
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TARGET_RETURN_PCT: ${{ inputs.target_return_pct }}
          MAX_HOLD_MONTHS: ${{ inputs.max_hold_months }}
          INVESTMENT_AMOUNT: ${{ inputs.investment_amount }}
          RISK_PCT_PER_TRADE: ${{ inputs.risk_pct_per_trade }}
          FORCE_RERUN: ${{ inputs.force_rerun }}
        run: python scripts/analyze_short_term.py "${{ inputs.stock }}"

      - name: Commit and push report
        run: |
          git config user.name "stock-analysis-agent"
          git config user.email "actions@github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "Short-term analysis: ${{ inputs.stock }}"
          git push
