name: Analyze Stock (Short-term, <12mo)

on:
  workflow_dispatch:
    inputs:
      stock:
        description: "Ticker or company name to analyze (e.g. RELIANCE.NS, or a US ticker)"
        required: true
        type: string
      target_return_pct:
        description: "Target return % within the hold window"
        required: false
        default: "25"
        type: string
      max_hold_months:
        description: "Maximum months for this horizon"
        required: false
        default: "12"
        type: string

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run analysis
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TARGET_RETURN_PCT: ${{ inputs.target_return_pct }}
          MAX_HOLD_MONTHS: ${{ inputs.max_hold_months }}
        run: python scripts/analyze_short_term.py "${{ inputs.stock }}"

      - name: Commit and push report
        run: |
          git config user.name "stock-analysis-agent"
          git config user.email "actions@github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "Short-term analysis: ${{ inputs.stock }}"
          git push
